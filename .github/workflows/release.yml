name: Build and Release make-wasi

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen bzip2 make patch

      - name: Set up wasi-sdk
        run: |
          WASI_SDK_VERSION="29.0"
          WASI_SDK_MAJOR="${WASI_SDK_VERSION%%.*}"
          mkdir -p wasi-sdk-tmp
          echo "Downloading wasi-sdk-${WASI_SDK_VERSION}..."
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_MAJOR}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz" | tar -xz -C wasi-sdk-tmp
          mv wasi-sdk-tmp/wasi-sdk-${WASI_SDK_VERSION}* wasi-sdk
          rm -rf wasi-sdk-tmp
          echo "WASI_SDK_PATH=$PWD/wasi-sdk" >> "$GITHUB_ENV"

      - name: Build make.wasm
        run: make build

      - name: Run Test Suite
        run: make test

      - name: Package Distribution Archives
        run: make dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: make-wasi-dist
          path: |
            bin/make.wasm
            bin/cli.js
            dist/make-wasi-*.tar.gz
            dist/*.tgz

      - name: Reset Rolling Tag 'latest'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete latest --cleanup-tag --yes || true
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          sleep 2
          git tag -f latest
          git push --force origin latest

      - name: Publish Latest Pre-release (Push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "make-wasi latest (rolling build)"
          body: |
            Automated continuous build from commit `${{ github.sha }}` on `main`.

            ### 📦 Downloadable Assets:
            - **`make-wasi-4.4.1.tgz`**: Standard npm tarball ready for installation (contains `bin/make.wasm`, `bin/cli.js`, and browser-safe `src/host.js`)
            - **`make-wasi-4.4.1.tar.gz`**: Standalone distribution archive (`bin/make.wasm`, `bin/cli.js`, `src/host.js`, `package.json`, `README.md`)
            - **`make.wasm`**: Standalone WebAssembly binary targeting WASI Preview 1
            - **`cli.js`**: Standalone Node.js CLI runner
          prerelease: true
          files: |
            bin/make.wasm
            bin/cli.js
            dist/make-wasi-*.tar.gz
            dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Release (Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "make-wasi ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            bin/make.wasm
            bin/cli.js
            dist/make-wasi-*.tar.gz
            dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
